function aris(){let cart=Object.entries(state.cart).filter(([id,q])=>q>0).map(([id,q])=>({p:PRODUCTS.find(p=>p.id===id),q})).filter(x=>x.p);let sum=cart.reduce((s,x)=>s+x.p.price*x.q,0);let cross=COUNTRIES[state.cbCountry];return `${banner('aris','Masuk ke mini merchant, kumpulkan pesanan, scan QR latihan, cek nama merchant dan nominal sebelum konfirmasi. Lalu coba pengalaman bayar lintas negara.')}${tabBar([['simulasi','① QRIS Lab'],['cross','② Cross Border Trip'],['materi','③ Kenali QRIS']],activeAris)}${activeAris==='materi'?`<div class="grid two-col"><section class="card lesson"><div class="eyebrow" style="color:${POS.aris.color}">KENALI DULU</div><h3>QRIS menyatukan cara bayar berbasis QR</h3><p>QRIS (Quick Response Code Indonesian Standard) adalah standar nasional QR pembayaran. Konsumen dapat menggunakan aplikasi pembayaran dari PJP yang berpartisipasi untuk bertransaksi di merchant yang menerima QRIS.</p><div class="flow-steps"><div class="flow-step"><span>📷</span><b>Scan QR</b><small>Buka aplikasi pembayaran</small></div><div class="flow-step"><span>🏪</span><b>Cek merchant</b><small>Pastikan nama sesuai</small></div><div class="flow-step"><span>💵</span><b>Cek nominal</b><small>Pastikan nilai benar</small></div><div class="flow-step"><span>✅</span><b>Konfirmasi</b><small>Masukkan PIN di aplikasi</small></div></div><div class="callout" style="margin-top:13px"><strong>Ingat:</strong> QRIS adalah standar pembayaran QR, bukan aplikasi dompet digital. Pembayaran tetap diproses melalui aplikasi atau layanan pembayaran yang berpartisipasi.</div><h3 style="margin-top:17px">Apa manfaatnya?</h3><ul><li>Memudahkan konsumen memilih aplikasi pembayaran.</li><li>Membantu merchant menerima pembayaran digital.</li><li>Mendukung ekosistem pembayaran yang saling terhubung.</li></ul><div class="model-grid"><article class="model-card"><span>🏪</span><b>MPM Statis</b><p>Merchant menempelkan QR tetap. Konsumen scan lalu mengisi nominal sendiri.</p></article><article class="model-card"><span>🧾</span><b>MPM Dinamis</b><p>Merchant membuat QR sesuai transaksi; nominal sudah diisi sebelum konsumen scan.</p></article><article class="model-card"><span>📱</span><b>CPM</b><p>Konsumen menampilkan QR dari aplikasi pembayaran untuk dipindai merchant.</p></article></div><div class="callout" style="margin-top:12px"><strong>QRIS Antarnegara:</strong> pengguna aplikasi pembayaran Indonesia yang berpartisipasi dapat memindai QR standar negara mitra. Pastikan aplikasi/PJP dan merchant mendukung, cek nama merchant serta nilai transaksi/konversi sebelum konfirmasi. Angka kurs dalam permainan hanya ilustrasi.</div></section><section class="card lesson"><h3>🎯 Mini check</h3><p>Kamu sedang antre di kantin dan akan membayar dengan QRIS. Informasi apa yang wajib kamu pastikan sebelum menekan konfirmasi?</p><div class="choice-list">${[['a','Foto profil pemilik warung'],['b','Nama merchant dan nominal pembayaran'],['c','Jumlah follower akun merchant']].map(([id,t])=>`<button class="choice" data-action="aris-mini" data-choice="${id}"><span class="radio"></span>${t}</button>`).join('')}</div><p class="footer-note">Jawaban latihan ini tidak mengurangi saldo virtual.</p><div id="arisMiniFeedback"></div></section></div>`:activeAris==='simulasi'?arisLab(cart,sum):activeAris==='cross'?crossLab(cross):arisMateri()}`}

t-size:11px;font-weight:900;margin-top:9px">KANTIN GENBI MISSION</div><div class="qr-meta">MID: GBI-001-TRAINING<br>Peserta memasukkan nominal dari keranjang</div><button class="btn" data-action="scan-merchant" style="margin-top:12px;width:100%" ${sum<=0?'disabled':''}>📷 Scan QR merchant</button><button class="btn secondary" data-action="reset-cart" style="margin-top:7px;width:100%">Kosongkan keranjang</button></div>${state.arisScanned?`<div class="receipt" style="margin-top:12px"><h4>✓ QR berhasil dibaca</h4><div class="receipt-row"><span>Merchant</span><b>Kantin GenBI Mission</b></div><div class="receipt-row"><span>Nominal</span><b>${money(sum)}</b></div><div class="receipt-row"><span>Mode</span><b>QR statis · nominal diinput konsumen</b></div><button class="btn green" data-action="pay-merchant" style="width:100%;margin-top:11px" ${sum>state.wallet?'disabled':''}>Konfirmasi pembayaran</button><p class="footer-note">Pastikan nama dan nominal sesuai sebelum konfirmasi.</p></div>`:''}${state.arisPaid?`<div class="debrief" style="margin-top:12px"><b>🎉 Pembayaran simulasi berhasil!</b><p>Struk pembayaran telah dibuat. Saldo latihan berkurang sesuai transaksi.</p></div>`:''}</section></div><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap"><div class="footer-note">Target misi: lakukan minimal 1 transaksi, periksa nama merchant, lalu lanjutkan ke QRIS Cross Border.</div><button class="btn" data-action="go-cross">Lanjut ke QRIS Cross Border →</button></div>`}
function crossLab(c){let v=Math.round(c.amount*c.rate);return `<section class="qr-passport"><div class="passport-heading"><div><span class="eyebrow">QR PASSPORT · 3 NEGARA</span><h3>Satu latihan, tiga identitas QR</h3><p>Amati elemen visual dan nama standar. Gambar disediakan untuk pembelajaran, bukan untuk pembayaran.</p></div><span class="passport-stamp">NO PAYMENT</span></div><div class="passport-grid"><article class="passport-card"><img src="${QR.id}" alt="Contoh kartu QRIS Indonesia"><div><b>🇮🇩 Indonesia</b><strong>QRIS</strong><small>Standar QR nasional Indonesia</small></div></article><article class="passport-card"><img src="${QR.th}" alt="Contoh PromptPay Thailand"><div><b>🇹🇭 Thailand</b><strong>Thai QR · PromptPay</strong><small>QR pembayaran Thailand</small></div></article><article class="passport-card"><img src="${QR.my}" alt="Contoh DuitNow QR Malaysia"><div><b>🇲🇾 Malaysia</b><strong>DuitNow QR</strong><small>Malaysia National QR</small></div></article></div><p class="passport-warning">PENTING: QR pada kartu ini berasal dari aset contoh yang diunggah. Jangan pindai menggunakan aplikasi bank/e-wallet dan jangan melakukan pembayaran. Praktik pada situs hanya membaca QR secara lokal atau memakai mode demo.</p></section><div class="grid two-col"><section class="card lesson"><div class="eyebrow" style="color:${POS.aris.color}">MISSION 02 · PASPOR DIGITAL</div><h3>Kenali QR negara mitra — simulasikan transaksi lintas negara</h3><p>Bayangkan kamu sedang liburan. Merchant di negara mitra menampilkan standar QR setempat. Jika aplikasi pembayaran Indonesia yang kamu gunakan ikut berpartisipasi, kamu dapat memindai QR merchant tersebut dan menyelesaikan pembayaran melalui aplikasi domestik.</p><div class="country-grid">${Object.entries(COUNTRIES).map(([id,x])=>`<button class="country ${id===state.cbCountry?'active':''}" data-action="cb-country" data-country="${id}"><span>${x.flag}</span><b>${x.name}</b><small>${x.standard}</small></button>`).join('')}</div><div class="callout" style="margin-top:12px"><strong>Mitra QRIS Antarnegara yang tercakup dalam materi BI:</strong> Thailand, Malaysia, Singapura, Jepang, Korea Selatan, dan Tiongkok. Pada praktik visual ini, contoh gambar tersedia untuk Indonesia, Thailand, dan Malaysia. Ketersediaan transaksi tetap bergantung pada aplikasi/PJP yang berpartisipasi dan merchant yang mendukung.</div><div class="step-list" style="margin-top:14px"><div class="step"><div class="step-num">1</div><div><b>Buka aplikasi pembayaran Indonesia</b><span>Gunakan aplikasi/PJP yang berpartisipasi pada koridor negara tujuan.</span></div></div><div class="step"><div class="step-num">2</div><div><b>Pindai QR merchant negara mitra</b><span>Contoh: ${c.standard} di ${c.name}.</span></div></div><div class="step"><div class="step-num">3</div><div><b>Periksa merchant dan nilai tukar</b><span>Pastikan merchant, jumlah dalam mata uang lokal, dan nilai ekuivalen Rupiah.</span></div></div><div class="step"><div class="step-num">4</div><div><b>Konfirmasi di aplikasi</b><span>Masukkan PIN hanya di aplikasi pembayaran resmi milikmu.</span></div></div></div></section><section class="card lesson"><div class="eyebrow" style="color:${POS.aris.color}">LIVE TRAVEL SIMULATOR</div><h3>${c.flag} ${c.name} · ${c.standard}</h3><p>${c.scene}</p><div class="qr-panel"><div class="qris-brand"><span class="qris-word">${c.standard.split(' ')[0].toUpperCase()}</span> PARTNER QR</div><img class="qr-img" src="${QR[state.cbCountry]}" alt="QR latihan ${c.standard}"><div class="qr-tag">CROSS BORDER TRAINING QR</div><div style="font-size:11px;font-weight:900;margin-top:9px">${c.merchant}</div><div class="qr-meta">Tagihan: ${c.amount.toLocaleString('id-ID')} ${c.currency}<br>QR latihan · tidak memproses pembayaran sungguhan</div><button class="btn" data-action="scan-cross" style="width:100%;margin-top:12px">📷 Scan QR ${c.standard}</button></div><div class="receipt" style="margin-top:12px"><div class="eyebrow">ESTIMASI KONVERSI LATIHAN</div><div class="receipt-row"><span>Nilai lokal</span><b>${c.amount.toLocaleString('id-ID')} ${c.currency}</b></div><div class="receipt-row"><span>Kurs latihan</span><b>1 ${c.currency} ≈ ${money(c.rate)}</b></div><div class="receipt-row"><span>Ekuivalen simulasi</span><b>${money(v)}</b></div><p class="footer-note">Kurs pada layar hanya angka ilustrasi untuk pembelajaran, bukan kurs aktual atau penawaran transaksi.</p></div>${state.cbScanned?`<div class="debrief" style="margin-top:12px"><b>✓ QR negara mitra terbaca</b><p>Merchant ${c.merchant} · ${c.amount} ${c.currency}. Cek nilai ekuivalen Rupiah sebelum konfirmasi.</p><button class="btn green" data-action="confirm-cross" style="margin-top:9px">Konfirmasi simulasi perjalanan</button></div>`:''}${state.cbDone?`<div class="debrief" style="margin-top:12px"><b>🌏 Misi Cross Border selesai!</b><p>Kamu berhasil menyelesaikan simulasi pembayaran pada merchant negara mitra.</p></div>`:''}</section></div><div class="callout" style="margin-top:14px"><strong>Ingat:</strong> QRIS Antarnegara adalah konektivitas sistem pembayaran berbasis QR antara Indonesia dan negara mitra; pengguna Indonesia memindai QR negara mitra memakai aplikasi pembayaran domestik yang berpartisipasi.</div><div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn green" data-action="complete-aris" ${(!state.arisPaid||!state.cbDone)?'disabled':''}>Tuntaskan Pos ARIS ✓</button></div>`}

</button>`).join('')}
</div><div class="chat-layout"><section class="chat-screen"><div class="chat-top"><span style="font-size:19px">‹</span><div class="chat-ava">${c.avatar}</div><div class="chat-top-copy"><b>${c.name} ${c.badge==='verified'?'<span class="verified">✓</span>':c.badge==='emoji'?'<span class="name-check">✔️</span>':c.badge==='claim-check'?'<span class="name-check" style="color:#70d28c">✓</span>':''}</b><small>cuplikan percakapan · simulasi edukasi</small></div><span>⋮</span></div><div class="chat-toolbar"><small>${c.phone}</small><span class="status-tag ${c.badge==='emoji'?'fake':c.badge==='none'?'none':c.badge==='claim-check'?'':'none'}">${c.badgeText}</span></div><div class="chat-wall"><div class="date-pill">HARI INI</div>${c.messages.map(m=>m[0]==='link'?`<div class="bubble"><div style="font-size:8px;color:#7c8a97;margin-bottom:4px">Tautan yang dikirim</div><button class="chat-link" data-action="chat-link" data-chat="${id}">${m[1]}</button><small>${m[2]} ✓✓</small></div>`:`<div class="bubble ${m[0]==='out'?'out':''}">${m[1]}<small>${m[2]} ${m[0]==='out'?'✓✓':''}</small></div>`).join('')}</div><div class="wa-input"><span>Pesan</span><span>＋　📷　🎙</span></div><div class="link-details"><div><b>Tinjau petunjuk</b><small>${c.linkLabel}</small></div><button class="btn small ${id==='a'?'':'red'}" data-action="chat-link" data-chat="${id}">${id==='a'?(opened?'Buka lagi':'Buka kanal BI'):(opened?'Tinjau lagi':'Tinjau permintaan')} ${id==='a'?'↗':'→'}</button></div></section></div><div class="analysis-panel"><section class="card evidence-card"><h3>🔎 Temukan petunjuk</h3><p class="microcopy">Pilih semua bukti yang kamu temukan pada percakapan ini. Jangan langsung percaya pada nama akun atau satu tanda saja.</p><div class="evidence-grid">${c.evidence.map(([key,text,kind])=>`<button class="evidence-item ${state.peka.flags[id].includes(key)?'active':''}" data-action="evidence" data-key="${key}"><span class="evidence-box">${state.peka.flags[id].includes(key)?'✓':''}</span>${text}</button>`).join('')}</div><p class="footer-note" style="margin-top:9px">Petunjuk dipilih: ${state.peka.flags[id].length} · Chat diperiksa: ${state.peka.visited.length}/3 · Tautan dibuka: ${state.peka.opened.length}/3</p></section><section class="card verdict-card"><h3>🧠 Klasifikasikan akun</h3><p class="microcopy">Menurut timmu, status chat yang sedang dibuka adalah…</p><div class="classify-row"><button class="classify ${state.peka.classes[id]==='official'?'active good':''}" data-action="classify" data-value="official">✓ RESMI</button><button class="classify ${state.peka.classes[id]==='suspicious'?'active bad':''}" data-action="classify" data-value="suspicious">⚠ CURIGA</button></div><div class="footer-note">Lanjutkan ke chat berikutnya dengan menekan kartu di panel kiri.</div>${id==='a'?`<div style="margin-top:12px"><b style="font-size:9px">Satu alasan utama memilih chat A?</b><div class="reason-list" style="margin-top:7px">${[['number','Nomor cocok dengan kontak resmi BI'],['domain','Domain tujuan adalah bi.go.id'],['safe','Tidak meminta data rahasia'],['badge-only','Karena ada centang saja, pasti asli']].map(([k,t])=>`<button class="reason ${state.peka.reasons.includes(k)?'active':''}" data-action="peka-reason" data-key="${k}"><i>${state.peka.reasons.includes(k)?'✓':''}</i>${t}</button>`).join('')}</div></div>`:''}</section></div><div class="card content-card" style="margin-top:14px;display:flex;justify-content:space-between;gap:13px;align-items:center;flex-wrap:wrap"><div><h3>🧾 Submit hasil investigasi</h3><p>Periksa 3 chat dan semua tautan sebelum mengunci analisis. Jawaban akan diberi pembahasan dan skor.</p>${state.peka.submitted?`<b style="font-size:10px;color:#24834f">Hasil analisis: ${state.peka.score}/100 poin</b>`:''}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn secondary" data-action="peka-reset">Reset analisis</button><button class="btn red" data-action="peka-submit" ${state.peka.visited.length<3||state.peka.opened.length<3||Object.values(state.peka.classes).some(x=>!x)||!state.peka.reasons.length?'disabled':''}>Kunci jawaban & lihat hasil</button></div></div>${state.peka.submitted?pekaDebrief():''}<div class="footer-note" style="margin-top:10px">Catatan desain: lencana pada akun A adalah bagian dari skenario simulasi, bukan pernyataan mengenai status verifikasi akun WhatsApp BI yang sebenarnya. Untuk memverifikasi layanan, cocokkan nomor dan tautan dengan informasi yang dipublikasikan BI. Kontak LISA tercantum di situs BI.</div>`}
function pekaDebrief(){let p=state.peka;let official=['a'];let classesOk=Object.keys(CHATS).filter(k=>p.classes[k]===(k==='a'?'official':'suspicious')).length;let flagGood=0,flagTotal=0;Object.entries(CHATS).forEach(([k,c])=>c.evidence.forEach(([key,_,kind])=>{if(kind!=='neutral'){flagTotal++;if(p.flags[k].includes(key))flagGood++}}));return `<div class="card content-card" style="margin-top:13px"><div class="eyebrow" style="color:${POS.peka.color}">MISSION DEBRIEF</div><h3>${p.score>=80?'🕵️ Detektif digital yang tajam!':p.score>=55?'🧩 Analisis cukup baik — cek lagi detailnya.':'🔍 Ayo teliti lagi setiap bukti.'}</h3><div class="metric-grid" style="margin-top:12px"><div class="metric"><small>Ketepatan klasifikasi</small><strong>${classesOk}/3</strong></div><div class="metric"><small>Bukti tepat terpilih</small><strong>${flagGood}/${flagTotal}</strong></div><div class="metric"><small>PEKA score</small><strong>${p.score}/100</strong></div></div><div class="callout" style="margin-top:12px"><strong>Jawaban utama:</strong> Chat A paling sesuai dengan kanal informasi LISA: nomor kontak dan rujukan domain bi.go.id cocok dengan kanal BI yang dipublikasikan, serta tidak meminta data rahasia. Chat B tetap mencurigakan walaupun terlihat ada centang, karena memakai tautan pendek dan meminta OTP dikirim melalui chat. Chat C sangat berbahaya: pengirim mengancam pemblokiran dan meminta nomor rekening, PIN mobile banking, serta OTP. Jangan pernah membagikan PIN atau OTP kepada siapa pun. Selalu cek ulang melalui kanal resmi yang dicari secara mandiri — jangan hanya percaya nama akun atau tanda centang.</div><p class="footer-note" style="margin-top:9px">Prinsip aman: jangan bagikan OTP/PIN, jangan membayar biaya yang tidak jelas, dan akses kanal resmi dengan mengetik alamat atau memakai kontak yang dipublikasikan lembaga.</p><button class="btn green" data-action="complete-peka" style="margin-top:10px">Selesaikan Pos PEKA ✓</button></div>`}
function eco(){return `${banner('ekonomi','Tim punya tiga kesempatan. Setiap pertanyaan menguji pemahaman, sementara bola sungguhan menentukan apakah target benar-benar masuk.')}${`<div class="callout" style="margin-bottom:14px"><strong>Ini permainan fisik:</strong> website membantu menampilkan skenario, memilih strategi, dan mencatat skor. Fasilitator tetap memvalidasi apakah bola/kantong kecil benar-benar masuk ke target.</div>`}<div class="grid two-col"><section class="card lesson"><div class="eyebrow" style="color:${POS.ekonomi.color}">ROUND ${Math.min(state.eco.round+1,3)} · 3 KESEMPATAN</div><div class="scenario"><div class="label">SKENARIO EKONOMI</div><h3>${state.eco.round>=3?'Semua kesempatan selesai!':ECO_Q[state.eco.question%ECO_Q.length].q}</h3><p>${state.eco.round>=3?'Lihat hasil tembakan tim dan lanjutkan ke ruang kendali BI.':'Baca skenario, diskusikan, lalu bidik kategori yang paling tepat.'}</p></div><h3 style="margin:15px 0 9px">Pilih target jawaban</h3><div class="target-board">${[['A','Stabilitas Harga','Inflasi dan kestabilan harga','#2868d5','#edf4ff'],['B','Sistem Pembayaran','QRIS, transfer, pembayaran digital','#db5148','#fff0ed'],['C','Rupiah','Uang rupiah dan pengelolaannya','#df9c18','#fff7e7'],['D','Bank Sentral','Peran dan kebijakan Bank Indonesia','#23945a','#eaf8ef']].map(([code,name,desc,color,soft])=>`<button class="target ${state.eco.target===code?'active':''}" style="--target:${color};--target-soft:${soft}" data-action="eco-target" data-target="${code}"><span class="letter">${code}</span><b>${name}</b><small>${desc}</small></button>`).join('')}</div><h3 style="font-size:11px;margin:15px 0 8px">Pilih tingkat tantangan</h3><div class="shot-modes">${[[10,'Shot biasa','Aman'],[20,'Shot sulit','Menengah'],[30,'Shot risiko','Sulit']].map(([v,t,s])=>`<button class="shot-mode ${state.eco.mode===v?'active':''}" data-action="eco-mode" data-mode="${v}"><b>${v} PTS</b><small>${t} · ${s}</small></button>`).join('')}</div><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:13px;flex-wrap:wrap"><label style="font-size:9px;color:#63718a;display:flex;gap:7px;align-items:center"><input type="checkbox" id="ballLanded" ${state.eco.landed?'checked':''}> Bola berhasil masuk target (validasi fasilitator)</label><button class="btn yellow" data-action="eco-throw" ${state.eco.round>=3||!state.eco.target?'disabled':''}>Catat lemparan →</button></div><p class="footer-note" style="margin-top:8px">Pilih target yang sesuai dengan pertanyaan. Poin diberikan jika jawaban benar dan bola benar-benar masuk. Salah bidik atau meleset = 0 poin.</p></section><section class="card lesson"><div class="eyebrow" style="color:${POS.ekonomi.color}">LIVE SCOREBOARD</div><h3>Strategi tim · ${esc(state.team)}</h3><div class="metric-grid" style="margin:11px 0"><div class="metric"><small>Kesempatan</small><strong>${state.eco.round}/3</strong></div><div class="metric"><small>Skor</small><strong>${state.scores.ekonomi}</strong></div><div class="metric"><small>Shot tepat</small><strong>${state.eco.shots.filter(x=>x.correct).length}</strong></div></div><div class="progress"><span style="width:${state.eco.round/3*100}%;background:${POS.ekonomi.color}"></span></div><h3 style="margin:16px 0 8px">Riwayat lemparan</h3>${state.eco.shots.length?state.eco.shots.map((x,i)=>`<div class="throw-result"><b>#${i+1} · ${x.target}</b><span>${x.correct?'✓ Tepat':'✕ Belum tepat'} · ${x.mode} poin risiko</span><strong style="margin-left:auto">${x.points} pts</strong></div>`).join(''):'<p class="microcopy">Belum ada lemparan yang dicatat. Tunjukkan strategi timmu!</p>'}${state.eco.round>=3?`<div class="debrief" style="margin-top:12px"><b>🏁 Round selesai</b><p>Fasilitator bisa mengulas kembali alasan jawaban benar sebelum pindah ke Pos 4.</p><button class="btn green" data-action="complete-eco" style="margin-top:9px">Selesaikan Pos Ekonomi Cerdas</button></div>`:''}</section></div><div class="card content-card" style="margin-top:14px"><h3>Aturan singkat permainan</h3><div class="flow-steps"><div class="flow-step"><span>📖</span><b>Baca skenario</b><small>Pahami konteks ekonomi</small></div><div class="flow-step"><span>🎯</span><b>Pilih target</b><small>A, B, C, atau D</small></div><div class="flow-step"><span>⚾</span><b>Lempar bola</b><small>Fasilitator validasi masuk</small></div><div class="flow-step"><span>⭐</span><b>Catat skor</b><small>10 / 20 / 30 poin</small></div></div></div>`}
function bi(){let id=state.bi.active,c=BICASES.find(x=>x.id===id);return `${banner('bi','Selesaikan empat kasus di BI Control Room. Pilih pilar tugas dan tindakan yang benar—bukan semua masalah ekonomi ditangani dengan cara yang sama.')}<div class="bi-room"><div class="eyebrow" style="color:#a2e0b9">BI CONTROL ROOM · SIMULASI PEMBELAJARAN</div><h3>Indonesia Situation Monitor</h3><p>Angka di bawah adalah indikator ilustratif untuk kebutuhan permainan, bukan data ekonomi aktual.</p><div class="sensor-grid"><div class="sensor"><small>Stabilitas harga</small><b>${id==='prices'?'Perlu perhatian':'Dipantau'}</b><div class="bar"><span style="width:${id==='prices'?34:78}%"></span></div></div><div class="sensor"><small>Sistem pembayaran</small><b>${id==='payments'?'Penguatan':'Berjalan'}</b><div class="bar"><span style="width:${id==='payments'?56:88}%"></span></div></div><div class="sensor"><small>Ketahanan sistem</small><b>${id==='system'?'Risiko meningkat':'Dipantau'}</b><div class="bar"><span style="width:${id==='system'?39:82}%"></span></div></div></div></div><div class="section-row"><div><h3>Pilih berkas kasus</h3><p>Setiap kasus menunjukkan konteks yang berbeda.</p></div><span class="pill">${Object.keys(state.bi.answers).length}/4 dianalisis</span></div><div class="case-grid">${BICASES.map(x=>`<button class="case-card ${id===x.id?'active':''}" data-action="bi-case" data-case="${x.id}"><span class="ico">${x.icon}</span><b>${x.title}</b><small>${x.scene.slice(0,110)}…</small><small style="margin-top:6px;color:${state.bi.answers[x.id]?'#22804c':'#8b96a8'}">${state.bi.answers[x.id]?'✓ Sudah dianalisis':'Belum dianalisis'}</small></button>`).join('')}</div><div class="grid two-col" style="margin-top:14px"><section class="card lesson"><div class="eyebrow" style="color:${POS.bi.color}">CASE FILE · ${c.title.toUpperCase()}</div><h3>${c.icon} ${c.title}</h3><p>${c.scene}</p><div class="callout"><strong>Pertanyaan analis:</strong> ${c.question}</div><h3 style="font-size:11px;margin:13px 0 8px">Pilih peran atau tindakan BI</h3><div class="choice-list">${c.opts.map(([k,t])=>`<button class="choice ${state.bi.answers[id]?.choice===k?'active':''}" data-action="bi-answer" data-answer="${k}"><span class="radio"></span>${t}</button>`).join('')}</div>${state.bi.answers[id]?`<div class="debrief" style="margin-top:12px"><b>${state.bi.answers[id].choice===c.correct?'✓ Analisis tepat':'↻ Coba pahami kembali'}</b><p>${c.why}</p></div>`:''}</section><section class="card lesson"><div class="eyebrow" style="color:${POS.bi.color}">THREE PILLARS · PERAN BI</div><h3>Tiga bidang tugas utama BI</h3><div class="step-list"><div class="step"><div class="step-num" style="background:#eaf3ff;color:#2868d5">1</div><div><b>Moneter</b><span>Menjaga stabilitas nilai Rupiah, termasuk kestabilan harga barang dan jasa serta nilai tukar.</span></div></div><div class="step"><div class="step-num" style="background:#fff2ed;color:#dd5148">2</div><div><b>Sistem pembayaran & pengelolaan Rupiah</b><span>Mengatur dan menjaga kelancaran sistem pembayaran serta mengelola uang Rupiah.</span></div></div><div class="step"><div class="step-num" style="background:#eaf8ef;color:#23945a">3</div><div><b>Makroprudensial</b><span>Memitigasi risiko sistemik dan mendukung ketahanan sistem keuangan.</span></div></div></div><div class="callout" style="margin-top:14px"><strong>Catatan penting:</strong> BI bukan bank komersial yang membuka tabungan masyarakat, bukan kementerian yang menetapkan pajak, dan bukan lembaga yang menentukan harga satu per satu di pasar.</div></section></div><div class="card content-card" style="margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><h3>Skor BI Control Room</h3><p>Setiap kasus benar bernilai 25 poin. Lengkapi empat kasus untuk menyelesaikan pos.</p></div><div><b style="font-size:20px;color:${POS.bi.color}">${state.scores.bi}/100</b> <button class="btn green" data-action="complete-bi" ${Object.keys(state.bi.answers).length<4?'disabled':''}>Selesaikan Pos 4 ✓</button></div></div>`}
function finalPage(){let q=state.quiz;if(q.finished){let score=q.answers.filter((a,i)=>a===QUIZ[i].correct).length;return `<div class="quiz-shell"><div class="card quiz-card" style="text-align:center"><div style="font-size:50px">🏆</div><div class="eyebrow" style="color:${POS.bi.color}">FINAL CHALLENGE · SELESAI</div><h1 style="font-size:33px;margin:7px">Kamu berhasil menyelesaikan misi!</h1><p class="muted">${esc(state.team)} · ${score}/15 jawaban benar</p><div class="metric-grid" style="margin:20px 0"><div class="metric"><small>Skor kuis</small><strong>${score*100/15|0}/100</strong></div><div class="metric"><small>Total poin misi</small><strong>${total()}</strong></div><div class="metric"><small>Pos selesai</small><strong>${completeCount()}/4</strong></div></div><div class="progress"><span style="width:${score/15*100}%;background:${POS.bi.color}"></span></div><p style="font-size:11px;color:#75829a;margin-top:14px">${score>=13?'Luar biasa! Kamu sangat siap menjadi generasi yang kenal BI dan PEKA.':score>=9?'Bagus! Perkuat lagi beberapa konsep dari empat pos.':'Misi selesai, sekarang waktunya mengulang materi dan belajar dari pembahasan.'}</p><button class="btn purple" data-action="quiz-restart" style="margin-top:14px">Ulangi Final Challenge</button></div></div>`}let i=q.index,item=QUIZ[i],chosen=q.answers[i];return `<div class="quiz-shell">${pageHead('FINAL CHALLENGE · KAHOOT STYLE','Saatnya buktikan!','15 pertanyaan dari empat pos. Diskusikan dengan anggota tim, lalu pilih jawaban terbaik.','<span class="pill">SOAL '+(i+1)+'/15</span>')}<div style="display:flex;justify-content:space-between;font-size:9px;color:#8290a6"><span>${item.cat} · GENBI MISSION</span><b>${q.answers.filter((a,j)=>a===QUIZ[j].correct).length} benar sementara</b></div><div class="quiz-progress"><span style="width:${i/15*100}%"></span></div><section class="card quiz-card"><div class="quiz-kicker">✦ PERTANYAAN ${String(i+1).padStart(2,'0')}</div><h2>${item.q}</h2><div class="answers">${item.a.map((a,j)=>`<button class="answer ${chosen!==undefined&&j===item.correct?'correct':chosen===j?'wrong':''}" data-action="quiz-answer" data-answer="${j}" ${chosen!==undefined?'disabled':''}><span class="key">${'ABCD'[j]}</span>${a}</button>`).join('')}</div>${chosen!==undefined?`<div class="feedback ${chosen===item.correct?'good':'bad'}">${chosen===item.correct?'✓ Tepat! ':'Belum tepat. '}${item.why}</div>`:''}<div class="quiz-actions"><small class="muted">${item.cat} · ${chosen!==undefined?'Jawaban sudah dikunci':'Pilih satu jawaban'}</small>${chosen!==undefined?`<button class="btn purple" data-action="quiz-next">${i===14?'Lihat hasil akhir':'Soal berikutnya →'}</button>`:''}</div></section><div style="text-align:center;margin-top:13px"><button class="link-btn" data-action="quiz-restart">Mulai ulang kuis</button></div></div>`}

    registrationCache=reg;
    const requested=teamCache.find(t=>t.id===reg.requested_team_id);
    const body='<div class="gate-help" style="margin:14px 0"><b>Nama peserta</b><br>'+esc(reg.participant_name)+'<br><br><b>Sekolah</b><br>'+esc(reg.school_name)+'<br><br><b>Kelompok yang dipilih</b><br>'+esc(requested?('Tim '+requested.team_number+' · '+requested.team_name):'Menunggu penetapan kelompok')+'</div><div class="notice" style="margin-top:12px"><b>⏳ Menunggu persetujuan fasilitator</b><br>Data pendaftaran sudah tersimpan. Halaman ini akan membuka misi secara otomatis setelah fasilitator menyetujui.</div><button class="btn ghost" data-cloud-action="refresh-access" style="width:100%;margin-top:13px">Perbarui status</button>';
    cloudShell('Pendaftaran sedang diperiksa','Terima kasih sudah mendaftar. Kamu belum bisa masuk ke materi dan praktik sebelum disetujui.',body);
    setStatus('⏳ Menunggu persetujuan');
  }
  function showRejected(reg){
    registrationCache=reg;
    const body='<div class="notice error" style="margin-top:13px"><b>Pendaftaran belum disetujui</b><br>'+esc(reg.review_note||'Silakan hubungi fasilitator untuk memperbaiki data atau memilih kelompok lain.')+'</div><button class="btn" data-cloud-action="reapply" style="width:100%;margin-top:13px">Perbaiki dan ajukan kembali</button>';
    cloudShell('Perlu perbaikan data','Fasilitator belum menyetujui pendaftaran ini. Kamu bisa memperbarui data lalu mengirim ulang.',body);
    setStatus('↻ Perlu perbaikan');
  }
  async function refreshAccess(){
    const {data:membership,error:memberError}=await client.from('team_members').select('team_id').eq('user_id',userId).maybeSingle();
    if(memberError)throw memberError;
    if(membership?.team_id){await activateTeam(membership.team_id);return;}
    const {data:reg,error}=await client.from('participant_registrations').select('id,user_id,participant_name,school_name,requested_team_id,approved_team_id,status,review_note,created_at').eq('user_id',userId).maybeSingle();
    if(error)throw error;
    if(!reg){registrationCache=null;await showRegistrationForm();return;}
    registrationCache=reg;
    await fetchTeams();
    if(reg.status==='pending'){showPending(reg);return;}
    if(reg.status==='rejected'){showRejected(reg);return;}
    if(reg.status==='approved'){
      setStatus('✓ Disetujui · menyiapkan kelompok');
      // Membership is inserted in the same approval transaction; retry once for a briefly stale read.
      const {data:again,error:againError}=await client.from('team_members').select('team_id').eq('user_id',userId).maybeSingle();
      if(againError)throw againError;
      if(again?.team_id){await activateTeam(again.team_id);return;}
      throw new Error('Pendaftaran disetujui tetapi keanggotaan tim belum terbaca. Tekan Perbarui status.');
    }
  }
  async function activateTeam(id){
    hydrating=true;teamId=id;
    const {data:team,error}=await client.from('teams').select('id,team_name,school_name,team_number').eq('id',id).single();
    if(error)throw error;
    const {data:registration}=await client.from('participant_registrations').select('participant_name,school_name').eq('user_id',userId).maybeSingle();
    state.team=team.team_name;state.school=team.school_name||registration?.school_name||'SMA';
    const hadProgress=await loadProgress();
    localStorage.setItem('genbiMissionV3',JSON.stringify(state));
    hydrating=false;
    if(!hadProgress)await persistNow();
    removeGate();setStatus('☁️ Tersinkron');
    window.GENBI_CLOUD.teamId=teamId;window.GENBI_CLOUD.team=team;window.GENBI_CLOUD.userId=userId;
    render();await refreshLeaderboard();subscribeRealtime();
  }
  function payloadFor(key){
    if(key==='aris')return {wallet:state.wallet,cart:state.cart,purchases:state.purchases,arisScanned:state.arisScanned,arisPaid:state.arisPaid,cbCountry:state.cbCountry,cbScanned:state.cbScanned,cbDone:state.cbDone};
    if(key==='peka')return JSON.parse(JSON.stringify(state.peka));
    if(key==='ekonomi')return JSON.parse(JSON.stringify(state.eco));
    if(key==='bi')return JSON.parse(JSON.stringify(state.bi));
    return JSON.parse(JSON.stringify(state.quiz));
  }
  function applyPayload(key,payload={}){
    if(key==='aris')Object.assign(state,{wallet:payload.wallet??50000,cart:payload.cart||{},purchases:payload.purchases||0,arisScanned:!!payload.arisScanned,arisPaid:!!payload.arisPaid,cbCountry:payload.cbCountry||'th',cbScanned:!!payload.cbScanned,cbDone:!!payload.cbDone});
    if(key==='peka'){if(payload.schema==='chat-image-v1')state.peka=Object.assign(blankState().peka,payload);else{state.peka=blankState().peka;state.scores.peka=0;state.completed.peka=false;}}
    if(key==='ekonomi')state.eco=Object.assign(blankState().eco,payload);
    if(key==='bi')state.bi=Object.assign(blankState().bi,payload);
    if(key==='final')state.quiz=Object.assign(blankState().quiz,payload);
  }
  async function loadProgress(){
    const {data,error}=await client.from('mission_progress').select('mission_key,score,completed,payload,updated_at').eq('team_id',teamId);
    if(error)throw error;
    const fresh=blankState();fresh.team=state.team;fresh.school=state.school;state=fresh;
    if(!data?.length)return false;
    data.forEach(row=>{
      const key=row.mission_key,scoreKey=SCORE_KEYS[key];
      if(scoreKey)state.scores[scoreKey]=Number(row.score||0);
      if(COMPLETION_KEYS[key])state.completed[key]=!!row.completed;
      applyPayload(key,row.payload||{});
    });
    localStorage.setItem('genbiMissionV3',JSON.stringify(state));
    return true;
  }
  async function persistNow(){
    if(!client||!teamId||!userId||hydrating||saving)return;
    saving=true;dirty=false;
    const records=Object.keys(SCORE_KEYS).map(key=>({
      team_id:teamId,mission_key:key,score:Math.max(0,Math.min(100,Number(state.scores[key]||0))),
      completed:key==='final'?!!state.quiz.finished:!!state.completed[key],payload:payloadFor(key),updated_by:userId,
      updated_at:new Date().toISOString()
    }));
    try{
      const {error}=await client.from('mission_progress').upsert(records,{onConflict:'team_id,mission_key'});
      if(error)throw error;
      setStatus('☁️ Tersinkron');
    }catch(err){setStatus('⚠️ Gagal sinkron',true);console.error('GENBI cloud sync:',err);}
    finally{saving=false;if(dirty)queueSave();}
  }
  function queueSave(){
    if(!teamId||hydrating)return;
    dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(()=>persistNow(),650);
  }
  async function refreshLeaderboard(){
    if(!client||!userId)return;
    const {data,error}=await client.from('leaderboard_public').select('team_id,team_number,team_name,school_name,total_score,completed_count').order('total_score',{ascending:false}).order('team_number',{ascending:true});
    if(error){console.warn('Leaderboard:',error.message);return;}
    leaderboardRows=data||[];window.GENBI_CLOUD.leaderboard=leaderboardRows;
    if(route==='leaderboard')render();
  }
  async function subscribeRealtime(){
    if(realtimeChannel)await client.removeChannel(realtimeChannel);
    realtimeChannel=client.channel('genbi-team-'+teamId)
      .on('postgres_changes',{event:'*',schema:'public',table:'mission_progress',filter:'team_id=eq.'+teamId},async payload=>{
        if(payload.new?.updated_by===userId)return;
        try{await loadProgress();render();}catch(e){console.error(e);}
      })
      .on('postgres_changes',{event:'*',schema:'public',table:'leaderboard_public'},()=>refreshLeaderboard())
      .subscribe(status=>{if(status==='SUBSCRIBED')setStatus('☁️ Live');});
  }
  async function logActivity(message){
    if(!client||!teamId||!userId)return;
    const key={aris:'aris',peka:'peka',ekonomi:'ekonomi',bi:'bi',final:'final'}[route];
    if(!key)return;
    const {error}=await client.from('mission_events').insert({team_id:teamId,mission_key:key,event_type:'activity',payload:{message:String(message).slice(0,240)},created_by:userId});
    if(error)console.warn('Activity log:',error.message);
  }
  async function updateSchool(name){
    if(!client||!teamId)return;
    const {error}=await client.from('teams').update({school_name:String(name).slice(0,70)}).eq('id',teamId);
    if(error)toast('Nama sekolah belum tersimpan ke server.');
    else{if(window.GENBI_CLOUD.team)window.GENBI_CLOUD.team.school_name=name;refreshLeaderboard();}
  }
  async function subscribeRegistration(){
    if(registrationChannel)await client.removeChannel(registrationChannel);
    registrationChannel=client.channel('genbi-registration-'+userId)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'participant_registrations',filter:'user_id=eq.'+userId},async()=>{try{await refreshAccess();}catch(err){showGateError(err.message||'Status belum dapat diperbarui.');}})
      .subscribe();
  }
  document.addEventListener('click',async e=>{
    const btn=e.target.closest('[data-cloud-action]');
    if(!btn)return;
    if(btn.dataset.cloudAction==='retry-register'){await showRegistrationForm();return;}
    if(btn.dataset.cloudAction==='refresh-access'){try{await refreshAccess();}catch(err){showGateError(err.message||'Tidak dapat memperbarui status.');}return;}
    if(btn.dataset.cloudAction==='reapply'){
      const {error}=await client.from('participant_registrations').delete().eq('user_id',userId).eq('status','rejected');
      if(error){showGateError(error.message||'Tidak dapat mengajukan ulang.');return;}
      await showRegistrationForm();return;
    }
  });
  async function init(){
    window.GENBI_CLOUD={queueSave,logActivity,updateSchool,refreshLeaderboard,leaderboard:leaderboardRows,client:null,teamId:null,userId:null};
    if(!window.supabase?.createClient){setStatus('⚠️ Library gagal dimuat',true);cloudShell('Koneksi tidak tersedia','Periksa internet lalu muat ulang halaman.','<div class="gate-help">Library Supabase belum berhasil dimuat.</div>');return;}
    client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{storageKey:'genbi-participant-auth-v2',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
    window.GENBI_CLOUD.client=client;setStatus('☁️ Menghubungkan…');
    try{
      let {data:{session},error:sessionError}=await client.auth.getSession();
      if(sessionError)throw sessionError;
      if(!session){
        const {data,error}=await client.auth.signInAnonymously();
        if(error)throw error;
        session={user:data.user};
      }
      userId=session.user.id;window.GENBI_CLOUD.userId=userId;
      await fetchTeams();
      await refreshAccess();
      await subscribeRegistration();
      // The approval listener is realtime; this periodic check also recovers from a dropped connection.
      window.setInterval(()=>{if(!teamId)refreshAccess().catch(err=>console.warn('Registration status:',err.message));},20000);
    }catch(err){
      console.error('GENBI init:',err);
      const msg=/anonymous|provider.*disabled|signup/i.test(err.message||'')
        ? 'Anonymous Sign-Ins belum aktif di Supabase. Aktifkan di Authentication → Sign In / Providers, lalu muat ulang.'
        : (err.message||'Koneksi Supabase belum berhasil. Periksa project URL, publishable key, dan Data API.');
      setStatus('⚠️ Perlu konfigurasi',true);
      cloudShell('Belum dapat masuk','Ada kendala saat menyiapkan sesi peserta.','<div id="cloudGateError" class="gate-error" style="display:block">'+esc(msg)+'</div>');
    }
  }
  window.GENBI_CLOUD={queueSave,logActivity,updateSchool,refreshLeaderboard,leaderboard:leaderboardRows,client:null,teamId:null,userId:null};
  document.addEventListener('DOMContentLoaded',init,{once:true});
  if(document.readyState!=='loading')init();
})();
</script>
</body></html>
